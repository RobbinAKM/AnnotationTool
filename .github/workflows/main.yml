name: Avida CI Pipeline

# Trigger the workflow on every push to any branch
on: [push]

jobs:
  build-and-lint:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      # 1. Grab the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up the Node environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Current Long Term Support (LTS) version
          cache: 'npm'       # Caches dependencies to make future runs much faster

      # 3. Install dependencies (Using 'ci' instead of 'install' is a senior best practice)
      - name: Install Dependencies
        run: npm ci

      # 4. Run the Linter to catch syntax/style errors
      - name: Run Lint
        run: npm run lint

      # 5. Build the application to ensure it compiles successfully
      - name: Build Project
        run: npm run build

        # 6. Run targeted unit tests
      - name: Run Tests
        run: npm run test
